<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多站連續導線座標計算與管理工具</title>
    <!-- 引入 SheetJS 用於前端匯出 Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-color: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            text-align: center;
        }

        .section-box {
            background-color: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .section-box h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #334155;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fff;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        th, td {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.9rem;
            vertical-align: middle;
        }

        th {
            background-color: #e2e8f0;
            font-weight: 600;
        }

        .angle-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
        }

        .angle-inputs input {
            text-align: center;
            padding: 6px 4px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary { background-color: var(--primary-color); color: white; flex: 2; }
        .btn-success { background-color: var(--success-color); color: white; flex: 1.5; }
        .btn-secondary { background-color: #e2e8f0; color: var(--text-color); flex: 1; }
        .btn-danger-outline { background-color: #fff; color: var(--danger-color); border: 1px solid var(--danger-color); flex: 1; }
        .btn-delete { background-color: var(--danger-color); color: white; padding: 6px 12px; font-size: 0.85rem; }

        #resultArea {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary-color);
            padding: 20px;
            border-radius: 6px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.95rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>多站連續導線座標計算與管理工具</h1>

    <!-- 起始後視點與設站點 -->
    <div class="section-box">
        <h3>📍 起始導線起算點 (第 1 站)</h3>
        <div class="grid-2">
            <div class="form-group">
                <label>初始後視點 點號 (BS):</label>
                <input type="text" id="bsId" value="GU04">
            </div>
            <div class="form-group">
                <label>初始設站點 點號 (ST):</label>
                <input type="text" id="stId" value="GU05">
            </div>
            <div class="form-group">
                <label>後視點 縱座標 (N):</label>
                <input type="number" step="any" id="bsN" value="2764649.941">
            </div>
            <div class="form-group">
                <label>設站點 縱座標 (N):</label>
                <input type="number" step="any" id="stN" value="2764662.2183">
            </div>
            <div class="form-group">
                <label>後視點 橫座標 (E):</label>
                <input type="number" step="any" id="bsE" value="308235.9495">
            </div>
            <div class="form-group">
                <label>設站點 橫座標 (E):</label>
                <input type="number" step="any" id="stE" value="308296.8343">
            </div>
        </div>
    </div>

    <!-- 連續導線點輸入表格 -->
    <div class="section-box">
        <h3>📊 導線前瞻點序列 (依序輸入各站點之邊長與夾角)</h3>
        <div class="table-container">
            <table id="traverseTable">
                <thead>
                    <tr>
                        <th style="width: 8%;">站序</th>
                        <th style="width: 18%;">目標點號 (ID)</th>
                        <th style="width: 22%;">邊長 (m)</th>
                        <th style="width: 40%;">夾角 (度分秒)</th>
                        <th style="width: 12%;">操作</th>
                    </tr>
                    <tr>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th>
                            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 0.8rem; color: #475569;">
                                <span>°</span><span>'</span><span>"</span>
                            </div>
                        </th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 動態生成 -->
                </tbody>
            </table>
        </div>
        <button type="button" id="addRowBtn" class="btn-secondary">＋ 新增導線延伸點</button>
    </div>

    <div class="btn-group">
        <button type="button" id="clearBtn" class="btn-danger-outline">🗑️ 清空所有點</button>
        <button type="button" id="calculateBtn" class="btn-primary">計算連續導線座標</button>
        <button type="button" id="exportExcelBtn" class="btn-success">📊 匯出完整 Excel 報表</button>
    </div>

    <div id="resultArea"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tbody = document.querySelector('#traverseTable tbody');
    const addRowBtn = document.getElementById('addRowBtn');
    const clearBtn = document.getElementById('clearBtn');
    const calculateBtn = document.getElementById('calculateBtn');
    const exportExcelBtn = document.getElementById('exportExcelBtn');
    const resultArea = document.getElementById('resultArea');

    function addRow(id = '', dist = '', deg = '', min = '', sec = '') {
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td class="row-index"></td>
            <td><input type="text" class="input-id" value="${id}" placeholder="例: Y254"></td>
            <td><input type="number" step="any" class="input-dist" value="${dist}" placeholder="邊長(m)"></td>
            <td>
                <div class="angle-inputs">
                    <input type="number" class="input-deg" value="${deg}" placeholder="度">
                    <input type="number" class="input-min" value="${min}" placeholder="分">
                    <input type="number" class="input-sec" value="${sec}" placeholder="秒">
                </div>
            </td>
            <td><button type="button" class="btn-delete">刪除</button></td>
        `;

        newRow.querySelector('.btn-delete').addEventListener('click', function() {
            newRow.remove();
            updateRowIndices();
        });

        tbody.appendChild(newRow);
        updateRowIndices();
    }

    function updateRowIndices() {
        const rows = tbody.querySelectorAll('tr');
        rows.forEach((row, index) => {
            row.querySelector('.row-index').textContent = index + 1;
        });
    }

    // 預設帶入第一筆測點 Y254
    addRow('Y254', '155.193', '289', '57', '48.4');

    addRowBtn.addEventListener('click', () => addRow());

    clearBtn.addEventListener('click', function() {
        if (confirm('確定清空所有資料嗎？')) {
            tbody.innerHTML = '';
            addRow();
            resultArea.style.display = 'none';
        }
    });

    function runTraverseCalculation() {
        let currentBsN = parseFloat(document.getElementById('bsN').value);
        let currentBsE = parseFloat(document.getElementById('bsE').value);
        let currentStN = parseFloat(document.getElementById('stN').value);
        let currentStE = parseFloat(document.getElementById('stE').value);
        let bsId = document.getElementById('bsId').value.trim() || 'BS';
        let stId = document.getElementById('stId').value.trim() || 'ST';

        if (isNaN(currentBsN) || isNaN(currentBsE) || isNaN(currentStN) || isNaN(currentStE)) {
            alert('請完整輸入初始起算點座標！');
            return null;
        }

        const rows = tbody.querySelectorAll('tr');
        let legs = [];
        rows.forEach((row, idx) => {
            const id = row.querySelector('.input-id').value.trim() || `P${idx+1}`;
            const dist = parseFloat(row.querySelector('.input-dist').value) || 0;
            const deg = parseFloat(row.querySelector('.input-deg').value) || 0;
            const min = parseFloat(row.querySelector('.input-min').value) || 0;
            const sec = parseFloat(row.querySelector('.input-sec').value) || 0;
            legs.push({ id, dist, deg, min, sec });
        });

        if (legs.length === 0) return null;

        let results = [];
        let activeBsN = currentBsN;
        let activeBsE = currentBsE;
        let activeStN = currentStN;
        let activeStE = currentStE;
        let activeBsId = bsId;
        let activeStId = stId;

        legs.forEach((leg, index) => {
            // 1. 計算當前站點的後視方位角 Az(ST -> BS)
            let dn = activeStN - activeBsN;
            let de = activeStE - activeBsE;
            let azBsSt = Math.atan2(de, dn) * (180 / Math.PI);
            if (azBsSt < 0) azBsSt += 360;
            let azStBs = (azBsSt + 180) % 360;

            // 2. 加上夾角得到前瞻方位角
            let angleDeg = leg.deg + (leg.min / 60) + (leg.sec / 3600);
            let fwdAz = (azStBs + angleDeg) % 360;

            // 3. 正算目標點座標
            let azRad = fwdAz * (Math.PI / 180);
            let targetN = activeStN + leg.dist * Math.cos(azRad);
            let targetE = activeStE + leg.dist * Math.sin(azRad);

            results.push({
                stationId: activeStId,
                targetId: leg.id,
                n: targetN,
                e: targetE,
                dist: leg.dist,
                deg: leg.deg,
                min: leg.min,
                sec: leg.sec,
                fwdAz: fwdAz
            });

            // 4. 滾動更新下一站的起算點 (當前設站點變成下站後視點，當前目標點變成下站設站點)
            activeBsN = activeStN;
            activeBsE = activeStE;
            activeBsId = activeStId;

            activeStN = targetN;
            activeStE = targetE;
            activeStId = leg.id;
        });

        return results;
    }

    calculateBtn.addEventListener('click', function() {
        const results = runTraverseCalculation();
        if (!results) return;

        let text = `=== 多站連續導線計算結果 ===\n`;
        results.forEach((r, idx) => {
            text += `第 ${idx+1} 站 [設站: ${r.stationId}] → 目標: ${r.targetId.padEnd(6)} | N = ${r.n.toFixed(4)}, E = ${r.e.toFixed(4)} | 邊長: ${r.dist}m | 方位角: ${r.fwdAz.toFixed(2)}°\n`;
        });

        resultArea.style.display = 'block';
        resultArea.textContent = text;
        resultArea.scrollIntoView({ behavior: 'smooth' });
    });

    exportExcelBtn.addEventListener('click', function() {
        const results = runTraverseCalculation();
        if (!results) return;

        const excelRows = [
            ["項次", "設站點 (ST)", "目標點 (ID)", "縱座標 (N)", "橫座標 (E)", "邊長 (m)", "夾角 (°)", "夾角 (')", "夾角 (\")"]
        ];

        results.forEach((r, idx) => {
            excelRows.push([
                idx + 1,
                r.stationId,
                r.targetId,
                Number(r.n.toFixed(4)),
                Number(r.e.toFixed(4)),
                r.dist,
                r.deg,
                r.min,
                r.sec
            ]);
        });

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(excelRows);

        XLSX.utils.book_append_sheet(wb, ws, "連續導線計算表");
        XLSX.writeFile(wb, `多站連續導線計算表_${new Date().toISOString().slice(0, 10)}.xlsx`);
    });
});
</script>

</body>
</html>
