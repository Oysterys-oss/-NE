<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>導線點座標正算與夾角計算工具</title>
    <!-- 引入 SheetJS 用於前端匯出 Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-color: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            text-align: center;
        }

        .section-box {
            background-color: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .section-box h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #334155;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fff;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        th, td {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.9rem;
            vertical-align: middle;
        }

        th {
            background-color: #e2e8f0;
            font-weight: 600;
        }

        .angle-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
        }

        .angle-inputs input {
            text-align: center;
            padding: 6px 4px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary { background-color: var(--primary-color); color: white; flex: 2; }
        .btn-success { background-color: var(--success-color); color: white; flex: 1.5; }
        .btn-secondary { background-color: #e2e8f0; color: var(--text-color); flex: 1; }
        .btn-danger-outline { background-color: #fff; color: var(--danger-color); border: 1px solid var(--danger-color); flex: 1; }
        .btn-delete { background-color: var(--danger-color); color: white; padding: 6px 12px; font-size: 0.85rem; }

        #resultArea {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary-color);
            padding: 20px;
            border-radius: 6px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.95rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>導線點座標正算與夾角計算工具</h1>

    <!-- 已知後視點與設站點 -->
    <div class="section-box">
        <h3>📍 已知起算點資料 (後視點與設站點)</h3>
        <div class="grid-2">
            <div class="form-group">
                <label>後視點 點號 (ID):</label>
                <input type="text" id="bsId" value="GU04">
            </div>
            <div class="form-group">
                <label>設站點 點號 (ID):</label>
                <input type="text" id="stId" value="GU05">
            </div>
            <div class="form-group">
                <label>後視點 縱座標 (N):</label>
                <input type="number" step="any" id="bsN" value="2764649.941">
            </div>
            <div class="form-group">
                <label>設站點 縱座標 (N):</label>
                <input type="number" step="any" id="stN" value="2764662.2183">
            </div>
            <div class="form-group">
                <label>後視點 橫座標 (E):</label>
                <input type="number" step="any" id="bsE" value="308235.9495">
            </div>
            <div class="form-group">
                <label>設站點 橫座標 (E):</label>
                <input type="number" step="any" id="stE" value="308296.8343">
            </div>
        </div>
    </div>

    <!-- 前瞻導線點與夾角輸入 -->
    <div class="section-box">
        <h3>📊 前瞻導線點資料與夾角輸入 (轉角法)</h3>
        <div class="table-container">
            <table id="traverseTable">
                <thead>
                    <tr>
                        <th rowspan="2" style="width: 8%;">項次</th>
                        <th rowspan="2" style="width: 18%;">點號 (ID)</th>
                        <th rowspan="2" style="width: 20%;">邊長 (m)</th>
                        <th style="width: 42%;">夾角 (度分秒)</th>
                        <th rowspan="2" style="width: 12%;">操作</th>
                    </tr>
                    <tr>
                        <th style="padding: 4px;">
                            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 0.8rem; color: #475569;">
                                <span>°</span><span>'</span><span>"</span>
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 動態生成 -->
                </tbody>
            </table>
        </div>
        <button type="button" id="addRowBtn" class="btn-secondary">＋ 新增前瞻導線點</button>
    </div>

    <div class="btn-group">
        <button type="button" id="clearBtn" class="btn-danger-outline">🗑️ 清空表格</button>
        <button type="button" id="calculateBtn" class="btn-primary">計算點座標 (N, E)</button>
        <button type="button" id="exportExcelBtn" class="btn-success">📊 匯出 Excel 格式報表</button>
    </div>

    <div id="resultArea"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tbody = document.querySelector('#traverseTable tbody');
    const addRowBtn = document.getElementById('addRowBtn');
    const clearBtn = document.getElementById('clearBtn');
    const calculateBtn = document.getElementById('calculateBtn');
    const exportExcelBtn = document.getElementById('exportExcelBtn');
    const resultArea = document.getElementById('resultArea');

    function addRow(id = '', dist = '', deg = '', min = '', sec = '') {
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td class="row-index"></td>
            <td><input type="text" class="input-id" value="${id}" placeholder="例: Y254"></td>
            <td><input type="number" step="any" class="input-dist" value="${dist}" placeholder="邊長(m)"></td>
            <td>
                <div class="angle-inputs">
                    <input type="number" class="input-deg" value="${deg}" placeholder="度">
                    <input type="number" class="input-min" value="${min}" placeholder="分">
                    <input type="number" class="input-sec" value="${sec}" placeholder="秒">
                </div>
            </td>
            <td><button type="button" class="btn-delete">刪除</button></td>
        `;

        newRow.querySelector('.btn-delete').addEventListener('click', function() {
            newRow.remove();
            updateRowIndices();
        });

        tbody.appendChild(newRow);
        updateRowIndices();
    }

    function updateRowIndices() {
        const rows = tbody.querySelectorAll('tr');
        rows.forEach((row, index) => {
            row.querySelector('.row-index').textContent = index + 1;
        });
    }

    // 預設帶入您的測試資料
    addRow('Y254', '155.193', '289', '57', '48.4');

    addRowBtn.addEventListener('click', () => addRow());

    clearBtn.addEventListener('click', function() {
        if (confirm('確定清空所有資料嗎？')) {
            tbody.innerHTML = '';
            addRow();
            resultArea.style.display = 'none';
        }
    });

    function performCalculation() {
        const bsId = document.getElementById('bsId').value.trim() || 'BS';
        const stId = document.getElementById('stId').value.trim() || 'ST';
        const bsN = parseFloat(document.getElementById('bsN').value);
        const bsE = parseFloat(document.getElementById('bsE').value);
        const stN = parseFloat(document.getElementById('stN').value);
        const stE = parseFloat(document.getElementById('stE').value);

        if (isNaN(bsN) || isNaN(bsE) || isNaN(stN) || isNaN(stE)) {
            alert('請完整輸入後視點與設站點座標！');
            return null;
        }

        // 1. 計算後視方向到設站點的方位角 Az(BS -> ST)
        const dnBsSt = stN - bsN;
        const deBsSt = stE - bsE;
        let azBsSt = Math.atan2(deBsSt, dnBsSt) * (180 / Math.PI);
        if (azBsSt < 0) azBsSt += 360;

        // 2. 計算後視方位角 Az(ST -> BS) = Az(BS -> ST) + 180°
        let azStBs = azBsSt + 180;
        if (azStBs >= 360) azStBs -= 360;

        const rows = tbody.querySelectorAll('tr');
        let tableData = [];
        rows.forEach((row, idx) => {
            const id = row.querySelector('.input-id').value.trim() || `P${idx+1}`;
            const dist = parseFloat(row.querySelector('.input-dist').value);
            const deg = parseFloat(row.querySelector('.input-deg').value) || 0;
            const min = parseFloat(row.querySelector('.input-min').value) || 0;
            const sec = parseFloat(row.querySelector('.input-sec').value) || 0;
            
            tableData.push({ id, dist, deg, min, sec });
        });

        if (tableData.length === 0) return null;

        let calculatedResults = [];
        let currentAzimuth = azStBs;

        tableData.forEach(item => {
            const dist = isNaN(item.dist) ? 0 : item.dist;
            const angleDeg = item.deg + (item.min / 60) + (item.sec / 3600);
            
            // 前瞻方位角 = 後視方位角 + 夾角(轉角)
            currentAzimuth = (currentAzimuth + angleDeg) % 360;
            if (currentAzimuth < 0) currentAzimuth += 360;

            const azRad = currentAzimuth * (Math.PI / 180);
            const n = stN + dist * Math.cos(azRad);
            const e = stE + dist * Math.sin(azRad);

            calculatedResults.push({
                id: item.id,
                n: n,
                e: e,
                dist: item.dist,
                deg: item.deg,
                min: item.min,
                sec: item.sec,
                fwdAz: currentAzimuth
            });
        });

        return { bsId, stId, bsN, bsE, stN, stE, results: calculatedResults };
    }

    calculateBtn.addEventListener('click', function() {
        const data = performCalculation();
        if (!data) return;

        let text = `=== 座標計算結果 ===\n`;
        text += `後視點: ${data.bsId.padEnd(6)} | N = ${data.bsN}, E = ${data.bsE}\n`;
        text += `設站點: ${data.stId.padEnd(6)} | N = ${data.stN}, E = ${data.stE}\n`;

        data.results.forEach(r => {
            text += `目標點: ${r.id.padEnd(6)} | N = ${r.n.toFixed(4)}, E = ${r.e.toFixed(4)} | 邊長: ${r.dist}m | 夾角: ${r.deg}°${r.min}'${r.sec}"\n`;
        });

        resultArea.style.display = 'block';
        resultArea.textContent = text;
        resultArea.scrollIntoView({ behavior: 'smooth' });
    });

    exportExcelBtn.addEventListener('click', function() {
        const data = performCalculation();
        if (!data) return;

        const excelRows = [
            ["點號 (ID)", "縱座標 (N)", "橫座標 (E)", "邊長 (m)", "夾角 (度分秒)", "", ""],
            ["", "", "", "", "°", "'", "\""]
        ];

        excelRows.push([data.bsId, data.bsN, data.bsE, "", "", "", ""]);
        
        const firstItem = data.results.length > 0 ? data.results[0] : null;
        excelRows.push([
            data.stId, 
            Number(data.stN.toFixed(4)), 
            Number(data.stE.toFixed(4)), 
            firstItem ? firstItem.dist : "", 
            firstItem ? firstItem.deg : "", 
            firstItem ? firstItem.min : "", 
            firstItem ? firstItem.sec : ""
        ]);

        for (let i = 0; i < data.results.length; i++) {
            let r = data.results[i];
            let nextItem = (i < data.results.length - 1) ? data.results[i + 1] : null;

            excelRows.push([
                r.id, 
                Number(r.n.toFixed(4)), 
                Number(r.e.toFixed(4)), 
                nextItem ? nextItem.dist : "", 
                nextItem ? nextItem.deg : "", 
                nextItem ? nextItem.min : "", 
                nextItem ? nextItem.sec : ""
            ]);
        }

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(excelRows);

        ws['!merges'] = [
            { s: { r: 0, c: 4 }, e: { r: 0, c: 6 } }
        ];

        XLSX.utils.book_append_sheet(wb, ws, "導線計算表");
        XLSX.writeFile(wb, `導線座標計算表_${new Date().toISOString().slice(0, 10)}.xlsx`);
    });
});
</script>

</body>
</html>
